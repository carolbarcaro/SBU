<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="tela_devolucao.css">
    <title>Devolução de livros</title>
</head>

<body>

    <header id="Header">
        <p id="textHeader">o o o</p>
        <a href="tela_inicial.html" id="linkDoBotao"><button type="button" id="botaoVoltarPagina"><i class="fa-solid fa-arrow-left"></i> PÁGINA ANTERIOR</button></a>
    </header>

    <main>

        <div class="cabecalho">
            <div id="LogoPuc">
                <img  src="../../assets/Imagens/Logo_Puc.png" class="logo" alt="Logo da PUC Campinas" width="215vw"
                    height="90vh">
            </div>

            <div id="TituloPagina">
            <h1>Área de devolução de livros</h1>
            <p>Preencha os dados abaixo para devolver o livro à biblioteca!</p>
            </div>
        </div>

        <br><br>

        <form class="formDevolucao" action="#" method="post">
            <div id="leftRow">
                <div class="inputGroup">
                    <label class="label" for="ra">Seu RA:</label>
                    <input class="input" type="text" id="ra" placeholder="Digite seu RA">
                </div>

            </div>
            <div id="rightRow">
                <div class="inputGroup">
                    <label class="label" for="codigo">Código do livro:</label>
                    <input class="input" type="text" id="codigo" placeholder="Digite o código do livro">
                </div>
            </div>
        </form>

        <div class="botao_enter">
            <button class="botao" id="botao" type="submit">Devolver</button>
        </div>

    </main>
</body>

</html>
