<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro-livros.css">
    <title>Document</title>
</head>

<body>
    <h1>Programa do Bibliotecário</h1>

    <div id="containerTitulo2">
        <h2>PUC Campinas</h2>
    </div>
    
    <div class="imagem-puc">
      <img src="Brasão_PUC-Campinas_-_Transparente (1).png" alt="Brasão Puc" class="Brasao">
    </div>
    
    <main>
        <div class="formulario-container">
            <p class="inicio">Preencha os dados abaixo para adicionar um novo título ao acervo da biblioteca.</p>

            <form id="containerFormulario">
                <div class="linha">
                    <div class="campo">
                        <label for="codigo">CÓDIGO:</label>
                        <input required type="text" id="codigo" placeholder="Código do livro">
                    </div>
                    <div class="campo">
                        <label for="titulo">TÍTULO:</label>
                        <input required type="text" id="titulo" placeholder="Nome do livro">
                    </div>
                </div>

                <div class="linha">
                    <div class="campo">
                        <label for="editora">EDITORA:</label>
                        <input required type="text" id="editora" placeholder="Nome da editora">
                    </div>
                    <div class="campo">
                        <label for="ano">ANO:</label>
                        <input required type="text" id="ano" placeholder="Ano de lançamento">
                    </div>
                </div>

                <div class="botao-container">
                    <button type="submit" class="botao" id="botao-salvar">SALVAR</button>
                </div>
            </form>

            <p class="aviso">Certifique-se de que as informações estão corretas para facilitar a busca e o empréstimo
                pelos leitores.</p>
        </div>
    </main>

    <div id="toast-sucesso"></div>
    <div id="toast-erro"></div>

    <script>
        const botao = document.getElementById('botao-salvar');
        const toastSucesso = document.getElementById('toast-sucesso');
        const toastErro = document.getElementById('toast-erro');

        botao.addEventListener('click', function(event) {
            event.preventDefault(); // evita envio do form nao sei se terá q mudar na hr do bd

            const codigo = document.getElementById('codigo').value.trim();
            const titulo = document.getElementById('titulo').value.trim();
            const editora = document.getElementById('editora').value.trim();
            const ano = document.getElementById('ano').value.trim();

            if (!codigo || !titulo || !editora || !ano) {
                toastErro.textContent = 'Por favor, preencha todos os campos!';
                toastErro.classList.add('show');
                setTimeout(() => toastErro.classList.remove('show'), 3000);
                return;
            }

            document.getElementById('codigo').value = '';
            document.getElementById('titulo').value = '';
            document.getElementById('editora').value = '';
            document.getElementById('ano').value = '';

            toastSucesso.textContent = 'As informações foram salvas com sucesso!';
            toastSucesso.classList.add('show');
            setTimeout(() => toastSucesso.classList.remove('show'), 3000);
        });
    </script>

</body>

</html>
