<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Aluno</title>
    <link rel="stylesheet" href="login_aluno.css">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script src="login_aluno.js"></script>

<body>
    <header id="topo">
        <p id="texttopo">o o o</p>
    </header>

    <header>
        <div id="LogoPuc">
            <img  src="../../assets/Imagens/Logo_Puc.png" class="logo" alt="Logo da PUC Campinas">
        </div>
        <div id="texto">
            <h1>Faça o seu login!</h1>
        </div>
    </header>

    <main>
        <form class="login_aluno" id="login_aluno" action="#" method="post">
            <div class="inputGroup">
                    <label class="label" for="ra">R.A:</label>
                    <input class="input" type="text" id="ra" name="ra" placeholder="Digite seu RA" pattern="\d{8}" title="Informe 8 dígitos" required>
                </div>

        </form> 
    </main>
</body>

</html>
