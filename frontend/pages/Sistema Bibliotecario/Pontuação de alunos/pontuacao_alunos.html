<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pontuação de Alunos</title>
    <link rel="stylesheet" href="pontuacao_alunos.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  </head>
  <body>
    <header id="Header">
      <p id="textHeader">o o o</p>

      <a href="../Area%20Bibliotecario/area_bibliotecario.html" id="linkDoBotao">
      <button type="button" id="botaoVoltarPagina">
        <i class="fa-solid fa-arrow-left"></i> PÁGINA ANTERIOR
      </button>
    </a>

    </header>
    <main>
      <div class="cabecalho">
        <div id="LogoPuc">
          <img
            src="../../../assets/Imagens/Logo_Puc.png"
            class="logo"
            alt="Logo da PUC Campinas"
            width="215vw"
            height="90vh"
          />
        </div>

        <div id="TituloPagina">
          <h1 class="Titulo-da-pagina">Pontuação de alunos</h1>
        </div>
      </div>

      <div class="filtros-container">
        <input
          type="text"
          id="searchInput"
          placeholder="Pesquisar por nome ou RA..."
        />

        <select id="filterLeitor">
          <option value="">Todos os tipos</option>
          <option value="Iniciante">Leitor Iniciante</option>
          <option value="Regular">Leitor Regular</option>
          <option value="Ativo">Leitor Ativo</option>
          <option value="Extremo">Leitor Extremo</option>
        </select>

        <div class="botao_enter">
          <button class="botao" id="botao" type="submit">Pesquisar</button>
        </div>
      </div>

      <table class="tabela-alunos">
        <thead>
          <tr>
            <th>RA</th>
            <th>Nome</th>
            <th>Qtd. Livros</th>
            <th>Tipo de Leitor</th>
          </tr>
        </thead>
        <tbody>
          <!-- As linhas serão inseridas aqui pelo JavaScript -->
        </tbody>
      </table>
    </main>
    <script src="pontuacao_alunos.js"></script>
  </body>
</html>
